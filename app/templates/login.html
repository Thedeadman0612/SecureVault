{% extends "base.html" %}

{% block title %}Unlock Vault — SecureVault{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">

    {# Logo / heading #}
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">🔒</div>
      <h1 class="text-2xl font-bold text-gray-900">SecureVault</h1>
      <p class="text-gray-500 text-sm mt-1">Enter your master password to unlock</p>
    </div>

    {# Error alert #}
    {% if error %}
    <div class="mb-4 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">
      {{ error }}
    </div>
    {% endif %}

    {# Login form #}
    <form method="POST" action="/login"
          class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
          Master Password
        </label>
        <input
          id="password"
          name="password"
          type="password"
          required
          autofocus
          autocomplete="current-password"
          placeholder="Enter your master password"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
        >
      </div>

      <button
        type="submit"
        class="w-full py-2 px-4 bg-indigo-600 text-white text-sm font-medium rounded-lg
               hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500
               focus:ring-offset-2 transition-colors"
      >
        Unlock Vault
      </button>

    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
      First time?
      <a href="/setup" class="text-indigo-600 hover:underline">Set up your vault</a>
    </p>

  </div>
</div>
{% endblock %}
