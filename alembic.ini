[alembic]
# Migration scripts directory
script_location = app/migrations

# Add project root to sys.path so app.* imports work inside env.py
prepend_sys_path = .

# Migration file naming: 20260519_a1b2c3d4_add_users_table.py
file_template = %%(rev)s_%%(slug)s

# Placeholder — overridden at runtime by env.py using app/config/settings.py
sqlalchemy.url = override_in_env_py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
