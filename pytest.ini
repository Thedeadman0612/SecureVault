[pytest]
# Suppress FastAPI's internal DeprecationWarning for the renamed HTTP status
# constant HTTP_422_UNPROCESSABLE_ENTITY → HTTP_422_UNPROCESSABLE_CONTENT.
# This is a FastAPI internals issue (fastapi/routing.py) — not our code.
# Remove this filter once FastAPI ships a release that no longer uses the old name.
filterwarnings =
    ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:DeprecationWarning:fastapi
